# 学習モデルへのフルパスを指定
pretrained_model_name_or_path = 'models/diffusion_models/Moss/moss_image_base_bf16.safetensors'
# テキストエンコーダーモデルへのフルパスを指定
# 相対パスは対話で入力したComfyUIパスを基準に絶対パス化します
text_encoder = 'models/text_encoders/Moss/qwen3.5_9b_int8_convrot.safetensors'
# VAEモデルへのフルパスを指定
vae = 'models/vae/Moss/flux2-vae.safetensors'
# 出力ディレクトリへのフルパスを指定
output_dir = 'E:\DataSetMoss\arcticwolf\LoRA\arcticwolf'
# ログ出力ディレクトリへのフルパスを指定
logging_dir = 'E:\DataSetMoss\arcticwolf\log'
# データセット設定ファイルへのフルパスを指定
dataset_config = 'E:\DataSetMoss\arcticwolf\dataset.toml'

disable_mmap_load_safetensors = true

cache_latents = true
cache_latents_to_disk = false
enable_bucket = true
max_data_loader_n_workers = 1
max_bucket_reso = 2048
min_bucket_reso = 512
resize_interpolation = 'lanczos'

gradient_checkpointing = true
persistent_data_loader_workers =  true
unsloth_offload_checkpointing = true
# MOSSの事前学習と同じタイムステップ分布
timestep_sampling = 'sigma'
weighting_scheme = 'logit_normal'
logit_mean = -1.09
logit_std = 0.95
discrete_flow_shift = 1.0
sdpa = true
mixed_precision = 'bf16'

network_module = 'networks.lora_generic'
# dimは上げれば細部まで学習する、alphaはdim/2が良く使用される
network_dim = 32
# 細部の表現が良好
network_alpha = 16
# 通常
#network_alpha = 16.0
# キャラLoRAの場合TEも学習した方が良い(false)、と言うのも新しいタグを柔軟に対応させる為
# 画風LoRAの場合はUNETのみの学習が良い(true)、細かいタグへの汚染を防ぐ為
# MOSS公式推奨: テキストエンコーダーは凍結しDiTのみ学習
network_train_unet_only = true

optimizer_type = 'AdamW8bit'
#optimizer_type = 'RAdamScheduleFree'
# l2 でボケたり暗い場合は huber にする
loss_type = 'l2'
# 学習率
#learning_rate = 1e-4
learning_rate = 7.5e-5
# UNETの学習率
#unet_lr = 1e-4
# TEの学習率
#text_encoder_lr = 5e-5
cache_text_encoder_outputs = false

#lr_scheduler = 'constant'
lr_scheduler = 'cosine_with_restarts'
lr_warmup_steps = 100
lr_scheduler_num_cycles = 4

# 学習エポック数を指定(概ね100～200枚の教師画像の場合10epoch位が丁度いい)
max_train_epochs = 10
save_every_n_epochs = 1

no_metadata = false
save_model_as = 'safetensors'
save_precision = 'bf16'
seed = 65535
# LoRAファイル名のプレフィクスを指定
output_name = 'moss-arcticwolf'
