[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssgen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
plot = ["tensorboard>=2.14", "matplotlib>=3.8"]

[project.scripts]
ssgen = "ssgen:main"
ssplot = "ssplot:main"

[tool.setuptools]
py-modules = ["ssgen", "ssplot"]
